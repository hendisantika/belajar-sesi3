spring:
  application:
    name: belajar-sesi3
  # Saat dev, Spring Boot Docker Compose meng-override koneksi ini ke container dari compose.yaml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounting}
    username: ${DB_USERNAME:accounting}
    password: ${DB_PASSWORD:accounting}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # skema dikelola Flyway, Hibernate hanya memvalidasi
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100      # batasi ukuran halaman dari query string
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs                  # default
  swagger-ui:
    path: /swagger-ui              # default
    operations-sorter: method           # urut GET, POST, PUT, ...
    tags-sorter: alpha
    try-it-out-enabled: true            # tombol Try it out aktif
    display-request-duration: true
  # Cakupan endpoint diatur per grup di OpenApiConfig (GroupedOpenApi.pathsToMatch).
  # Jangan set springdoc.paths-to-match global: nilainya menimpa filter per grup.
  default-produces-media-type: application/json

logging:
  pattern:
    # %X{correlationId} membaca nilai MDC yang diisi CorrelationIdFilter
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{20} : %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  swagger-ui:
    enabled: false                      # UI dimatikan di production
  api-docs:
    enabled: false
