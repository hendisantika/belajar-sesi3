openapi: 3.1.0
info:
  title: Autochem Accounting API
  description: "API Chart of Accounts, Journal, Posting & Reporting"
  contact:
    name: Tim Engineering Autochem
    email: engineering@example.id
  version: v1
servers:
- url: http://localhost:8080
  description: Lokal
- url: https://staging-api.example.id
  description: Staging
tags:
- name: Chart of Accounts
  description: Kelola akun COA
- name: Journal
  description: Pembuatan & posting jurnal (implementasi Sesi 4-5)
paths:
  /api/v1/accounts/{id}:
    get:
      tags:
      - Chart of Accounts
      summary: Detail akun
      description: Mengembalikan akun aktif maupun nonaktif.
      operationId: get
      parameters:
      - name: id
        in: path
        description: ID akun
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Akun ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          description: Akun tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: Not Found
                status: 404
                detail: Akun 99 tidak ditemukan
                requestId: d4e5f6
    put:
      tags:
      - Chart of Accounts
      summary: Ubah akun
      description: "Mengganti nama, tipe, dan akun induk. Kode akun tidak bisa diubah."
      operationId: update
      parameters:
      - name: id
        in: path
        description: ID akun
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
        required: true
      responses:
        "200":
          description: Akun diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Payload tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: Validasi gagal
                status: 400
                errors:
                - "code: must not be blank"
                requestId: a1b2c3
        "404":
          description: Akun tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: Not Found
                status: 404
                detail: Akun 99 tidak ditemukan
                requestId: d4e5f6
  /api/v1/journals/{id}/post:
    post:
      tags:
      - Journal
      summary: Posting jurnal ke buku besar
      operationId: post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Berhasil diposting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResult"
        "400":
          description: Header Idempotency-Key tidak dikirim
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Jurnal sudah diposting
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/accounts:
    get:
      tags:
      - Chart of Accounts
      summary: Daftar akun aktif (paginated)
      description: "Query string: page (mulai 0), size (maks 100), sort (mis. code,asc\
        \ atau name,desc)."
      operationId: list
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "code,ASC"
          items:
            type: string
      responses:
        "200":
          description: Halaman akun aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedModelAccountSummary"
        "400":
          description: Parameter sort tidak dikenal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Chart of Accounts
      summary: Buat akun baru
      description: Kode akun 4 digit dan harus unik. Akun induk (opsional) harus aktif
        dan bertipe sama.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          description: Akun dibuat; header Location berisi URL akun baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Payload tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: Validasi gagal
                status: 400
                errors:
                - "code: must not be blank"
                requestId: a1b2c3
        "409":
          description: Kode akun sudah dipakai
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: Conflict
                status: 409
                detail: Kode akun 1101 sudah digunakan
                requestId: g7h8i9
  /api/v1/accounts/{id}/deactivate:
    patch:
      tags:
      - Chart of Accounts
      summary: Nonaktifkan akun
      description: "Idempotent: akun nonaktif tidak muncul di daftar, tetapi tetap\
        \ bisa dilihat detailnya."
      operationId: deactivate
      parameters:
      - name: id
        in: path
        description: ID akun
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Akun dinonaktifkan
        "404":
          description: Akun tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: Not Found
                status: 404
                detail: Akun 99 tidak ditemukan
                requestId: d4e5f6
  /api/v1/journals/{id}:
    get:
      tags:
      - Journal
      summary: Detail jurnal
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateAccountRequest:
      type: object
      description: Data untuk mengubah akun COA
      properties:
        name:
          type: string
          description: Nama akun
          example: Persediaan Barang Dagang
          maxLength: 150
          minLength: 0
        type:
          type: string
          description: Tipe akun
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          example: ASSET
        parentCode:
          type: string
          description: Kode akun induk (opsional)
          example: "1000"
          pattern: "\\d{4}"
      required:
      - name
      - type
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    AccountResponse:
      type: object
      description: Detail akun COA
      properties:
        id:
          type: integer
          format: int64
          description: ID akun
          example: 6
        code:
          type: string
          description: Kode akun
          example: "1301"
        name:
          type: string
          description: Nama akun
          example: Persediaan
        type:
          type: string
          description: Tipe akun
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          example: ASSET
        parentCode:
          type:
          - string
          - "null"
          description: Kode akun induk
          example: "1000"
        active:
          type: boolean
          description: Status aktif
          example: true
    PostResult:
      type: object
      properties:
        journalId:
          type: integer
          format: int64
        status:
          type: string
        idempotencyKey:
          type: string
    CreateAccountRequest:
      type: object
      description: Data untuk membuat akun COA
      properties:
        code:
          type: string
          description: Kode akun 4 digit
          example: "1301"
          minLength: 1
          pattern: "\\d{4}"
        name:
          type: string
          description: Nama akun
          example: Persediaan
          maxLength: 150
          minLength: 0
        type:
          type: string
          description: Tipe akun
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          example: ASSET
        parentCode:
          type: string
          description: Kode akun induk (opsional)
          example: "1000"
          pattern: "\\d{4}"
      required:
      - code
      - name
      - type
    JournalResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
    AccountSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      required:
      - number
      - size
      - totalElements
      - totalPages
    PagedModelAccountSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
