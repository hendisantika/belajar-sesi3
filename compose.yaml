services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=accounting'
      - 'POSTGRES_USER=accounting'
      - 'POSTGRES_PASSWORD=accounting'
    ports:
      # Port host acak agar tidak bentrok dengan PostgreSQL lokal; Spring Boot Docker Compose
      # otomatis memakai port yang terpetakan (cek manual: docker compose port postgres 5432)
      - '5432'
